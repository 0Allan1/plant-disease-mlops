# Round-robin load balancer in front of N API containers.
# Docker's DNS returns every replica of "api"; re-resolving every 5 s lets us scale up/down live.
server {
    listen 80;
    client_max_body_size 600m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
