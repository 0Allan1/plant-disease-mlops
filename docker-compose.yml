services:
  api:                      # no fixed name / port, so it can be scaled:  docker compose up --scale api=3
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - RETRAIN_THRESHOLD=50
      - AUTO_RETRAIN=true
    restart: unless-stopped

  gateway:                  # load balancer, the only public API entry point
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://gateway
    depends_on:
      - gateway
    restart: unless-stopped
